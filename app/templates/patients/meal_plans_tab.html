<div id="meal-plans-table" class="card mb-4 border-0 shadow-sm">
    <h6 class="mb-2 p-1">
        Plans alimentaires
        <button class="btn btn-success rounded-circle"
                style="width: 28px; height: 28px; padding: 0"
                hx-get="/patients/{{ patient.id }}/meal_plans/new" 
                hx-target="#manage-meal-plans-form"
                hx-swap="innerHTML"
                hx-on::after-request="new bootstrap.Modal(document.getElementById('mealplansModal')).show()">
            <i class="bi bi-plus text-white"></i>
        </button>
    </h6>
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-secondary">
                <tr>
                    <th>Titre</th>
                    <th>Nom</th>
                    <th>Date de début</th>
                    <th>Objectif</th>
                    <th>Calories</th>
                    <th style="width: 100px;">Action</th>
                </tr>
            </thead>
            <tbody>
                {% for row in meal_plans %}
                <tr>
                    <td>Plan {{ row.plan.number }}</td>
                    <td>{{row.plan.name}}</td>
                    <td>{{row.plan.start_date }}</td>
                    <td>{{row.plan.goal or "-"}}</td>
                    <td>{{row.calories}}</td>
                    <td>
                        <a href="/meal_plans/{{ row.plan.id }}" class="btn btn-sm btn-info"><i class="bi bi-eye"></i></a>
                        <button hx-delete="/patients/{{ patient.id }}/meal_plans/{{ row.plan.id }}" 
                                hx-target="#meal-plans-table"
                                hx-swap="outerHTML"
                                class="btn btn-sm btn-danger">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
