<!-- templates/foods/page.html -->

{% extends "base.html" %}
{% block title %}Aliments{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">Aliments</h4>
    <button class="btn btn-success"
            hx-get="/foods/new"
            hx-target="#foods-form"
            hx-swap="innerHTML"
            hx-on::after-request="new bootstrap.Modal(document.getElementById('foodsModal')).show()">
        <i class="bi bi-plus"></i> Ajouter un aliment
    </button>
</div>

{% include "foods/search_bar.html" %}

<div id="food-detail">
    {% if food %}
    {% include "foods/details.html" %}
    {% else %}
    <p class="text-muted">Recherchez un aliment pour afficher ses valeurs nutritionnelles.</p>
    {% endif %}
</div>

<!-- Form to create/edit a food -->
<div class="modal fade" id="foodsModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content" id="foods-form"></div>
    </div>
</div>

{% endblock %}
