<!-- templates/foods/search_bar.html -->

<div class="card mb-3 border-0 shadow-sm">
    <div class="card-body">
        <label class="form-label" for="food-search">Rechercher un aliment</label>
        <input  type="text"
                id="food-search"
                name="food_search"
                class="form-control"
                placeholder="Nom de l'aliment..."
                autocomplete="off"
                hx-get="/foods/search?as_links=true"
                hx-trigger="keyup changed delay:300ms"
                hx-target="#food-results"
                hx-swap="innerHTML">
        <div id="food-results" class="list-group mt-2" style="max-height: 20rem; overflow-y: auto;"></div>
    </div>
</div>
