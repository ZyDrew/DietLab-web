<!-- templates/foods/form.html -->

<div class="modal-header bg-success text-white">
    <h5 class="modal-title">Nouvel aliment</h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
</div>
<form   hx-post="/foods/new"
        hx-target="#form-errors"
        hx-swap="innerHTML">
    <div class="modal-body">
        <div id="form-errors"></div>
        <div class="row g-3">
            <div class="col-12">
                <label class="form-label" for="food-name">Nom</label>
                <input  type="text"
                        id="food-name"
                        class="form-control"
                        name="name"
                        maxlength="300"
                        required>
            </div>

            {% for field, label in [
                ("calories", "Calories (kcal)"),
                ("proteins", "Protéines (g)"),
                ("carbs", "Glucides (g)"),
                ("fat", "Lipides (g)"),
                ("calcium", "Calcium (mg)"),
                ("iron", "Fer (mg)"),
                ("vitamin_c", "Vitamine C (mg)")
            ] %}
            <div class="col-md-4">
                <label class="form-label" for="food-{{ field }}">{{ label }}</label>
                <input  type="number"
                        id="food-{{ field }}"
                        class="form-control"
                        name="{{ field }}"
                        min="0"
                        max="99999999.99"
                        step="0.01"
                        placeholder="0.00"
                        required>
            </div>
            {% endfor %}
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
        <button type="submit" class="btn btn-success">Enregistrer</button>
    </div>
</form>
