<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DietLab - Erreur interne</title>
        <style>
            body {
                margin: 0;
                background: #f8f9fa;
                color: #212529;
                font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            }
            main {
                max-width: 32rem;
                margin: 12vh auto;
                padding: 2rem;
                background: #fff;
                border: 1px solid #dee2e6;
                border-radius: 0.5rem;
                text-align: center;
            }
            h1 {
                margin-top: 0;
            }
            .actions {
                margin-top: 1.5rem;
            }
            .btn {
                display: inline-block;
                margin: 0.25rem;
                padding: 0.5rem 1rem;
                border: 1px solid #0d6efd;
                border-radius: 0.375rem;
                background: #0d6efd;
                color: #fff;
                font: inherit;
                text-decoration: none;
                cursor: pointer;
            }
            .btn-secondary {
                background: #fff;
                color: #0d6efd;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Erreur interne</h1>
            <p>Une erreur est survenue. Réessayez dans quelques instants.</p>
            <div class="actions">
                <a class="btn" href="/">Retour à l'accueil</a>
            </div>
        </main>
    </body>
</html>
